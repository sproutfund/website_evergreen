# Export configuration for generating PROGRAMS_*.md files
# Usage: bundle exec jekyll build --config "_config.yml,_config_export.yml"
# Exports all program pages to filtered markdown files in exports/ directory

# Dependencies
markdown:       kramdown
highlighter:    rouge

kramdown:
  auto_ids:           true
  syntax_highlighter: rouge

# Permalinks
permalink:      pretty

# Use clean URLs for the export
baseurl: "https://www.sproutfund.org"
encoding:       UTF-8

exclude:
  - CNAME
  - .bundle/
  - .git/
  - .github/
  - _vendor/
  - _assets_src/
  - docs/
  - logos/src/
  - _photos_src/
  - node_modules/
  - AGENTS.md
  - CLAUDE.md
  - CODE_OF_CONDUCT.md
  - composer.json
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - package.js
  - package.json
  - package-lock.json
  - exports/
  - README.md
  - LICENSE.md
  - TO-DO.md
  - sache.json
  - twbsconfig.yml
  - vendor.yml
  - scripts
  - "*.bak"
  - "*.sh"
  - search/data_projects.json
  - search/data_programs.json
  - test.md
  - year/

keep_files:
  - assets/brand/
  - assets/fonts/
  - assets/img/
  - assets/js/
  - downloads/
  - photos/
  - videos/
  - theme/

plugins:
  - github-pages
#  - jekyll-github-metadata
  - jekyll-redirect-from
#  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap
  - jemoji

# Github
repository: sproutfund/website_evergreen

# Custom variables
repo:               "https://github.com/sproutfund/website_evergreen"

relative_links:
  enabled:     true
  collections: false

sass:
  sass_dir: _sass
  style: compressed
